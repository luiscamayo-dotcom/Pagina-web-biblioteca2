<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Biblioteca</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="registro-container">
    <div class="registro-header">
      <img src="../images/logo.jpg" alt="Logo Biblioteca" class="logo">
      <h1>Registro de Usuario</h1>
    </div>

    <form id="registroForm" class="registro-form">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" placeholder="Ingrese su nombre">

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" placeholder="Ingrese su correo">

      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="Ingrese su contraseña">

      <button type="submit" class="btn-registro">Registrarse</button>
    </form>

    <div class="cardTable">
      <h2>Usuarios registrados</h2>
      <table id="usersTable">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Correo</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="C:\Users\alban\OneDrive\Documentos\PAUmabel\microptoyecto2\Js\script.js"></script>
</body>
</html>
